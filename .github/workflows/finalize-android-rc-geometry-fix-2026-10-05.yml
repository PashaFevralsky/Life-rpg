name: Finalize Android RC Geometry Fix 2026-10-05
run-name: Finalize Android RC geometry fix and hand off to official RC

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-android-rc-geometry-fix-2026-10-05.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-finalize-android-geometry
  cancel-in-progress: true

jobs:
  patch-test-commit:
    name: Patch, fully test, then trigger official Android RC
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard exact source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Apply final geometry-contract correction
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          payload = ""
          Path(".finalize-android-geometry.py").write_bytes(base64.b64decode(payload))
          PY
          python3 .finalize-android-geometry.py
          rm -f .finalize-android-geometry.py

      - name: Verify corrected source contract statically
        shell: bash
        run: |
          node --check android-ui-14.e2e.test.js
          node --check audit-fix-2026-10-05.test.js
          node <<'NODE'
          const fs=require("fs");
          const e=fs.readFileSync("android-ui-14.e2e.test.js","utf8");
          const a=fs.readFileSync("audit-fix-2026-10-05.test.js","utf8");
          const css=fs.readFileSync("interface-13.9.css","utf8");
          const ui=fs.readFileSync("ui.js","utf8");
          const required=[
            'expect(h.headCopyDisplay).not.toBe("none")',
            'expect(h.titleDisplay).toBe("none")',
            'expect(h.descDisplay).toBe("none")',
            'expect([null,"none"]).toContain(h.clarityDisplay)',
            'expect(h.commandDisplay).toBe("grid")',
            'expect(h.commandWidth).toBeGreaterThanOrEqual(44)',
            'expect(h.commandHeight).toBeGreaterThanOrEqual(44)'
          ];
          for(const s of required)if(!e.includes(s))throw new Error("Missing corrected E2E contract: "+s);
          if(e.includes('expect(h.headCopyDisplay).toBe("none")'))throw new Error("Stale sticky E2E contract remains");
          if(!a.includes("E2E must verify command touch width"))throw new Error("Audit meta-test was not aligned");
          if(!css.includes(".ux7-head-actions>#commandPaletteBtn"))throw new Error("Sticky command CSS contract missing");
          if(!css.includes("display:grid!important"))throw new Error("Sticky command display contract missing");
          if(!ui.includes("ui139SyncCommandPalette(sectionId)"))throw new Error("Command palette relocation runtime missing");
          NODE

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete source regression suite
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Audit production web bundle
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete mobile browser E2E
        run: npm run test:e2e

      - name: Verify only intended source files changed
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={"android-ui-14.e2e.test.js","audit-fix-2026-10-05.test.js","FINAL-AUDIT-2026-10-05.md"}
          changed=set(filter(None,subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()))
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected modified files: "+", ".join(sorted(unexpected)))
          required={"android-ui-14.e2e.test.js","audit-fix-2026-10-05.test.js"}
          missing=required-changed
          if missing:
              raise SystemExit("Expected corrected files are unchanged: "+", ".join(sorted(missing)))
          print("OK — intended diff only:", ", ".join(sorted(changed)))
          PY

      - name: Guard main before commit
        shell: bash
        run: |
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE" = "$GITHUB_SHA" || {
            echo "main changed during verification; refusing to overwrite newer work"
            exit 1
          }

      - name: Commit verified correction to main
        shell: bash
        run: |
          git add android-ui-14.e2e.test.js audit-fix-2026-10-05.test.js FINAL-AUDIT-2026-10-05.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Android geometry gate with final sticky-header UX"
          git push origin HEAD:main

      - name: Confirm official Android RC trigger path
        shell: bash
        run: |
          git show --name-only --format= HEAD | grep -Fx "android-ui-14.e2e.test.js"
          grep -Fq '"android-ui-14.e2e.test.js"' .github/workflows/android-rc.yml
          echo "OK — push matches official Android RC workflow path filter."
