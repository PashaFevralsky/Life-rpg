      - name: Apply complete audit patch
        shell: bash
        run: |
          node .life-rpg-final-audit.mjs
          rm -f .life-rpg-final-audit.mjs

      - name: Syntax-check critical patched files
        shell: bash
        run: |
          node --check finance.js
          node --check imports.js
          node --check state.js
          node --check ui.js
          node --check life-ops.js
          node --check ai-bridge-worker.mjs
          node --check audit-fix-2026-10-05.test.js
          node --check cashflow-fix-2026-10-05.test.js
          node --check final-audit-2026-10-05.test.js

      - name: Run audit-specific regression gates
        shell: bash
        run: |
          node audit-fix-2026-10-05.test.js
          node cashflow-fix-2026-10-05.test.js
          node final-audit-2026-10-05.test.js

      - name: Run full source regression suite
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Audit production bundle
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser E2E
        run: npm run test:e2e

      - name: Verify patch integrity
        shell: bash
        run: |
          git diff --check
          git status --short
          test -f AUDIT-FIX-2026-10-05.md
          test -f CASHFLOW-FIX-2026-10-05.md
          test -f FINAL-AUDIT-2026-10-05.md
          grep -q 'readJsonBodyLimited(request,MAX_BODY_BYTES)' ai-bridge-worker.mjs
          grep -q 'function assetCashDelta' finance.js
          grep -q 'function debtPriorityLabel' finance.js

      - name: Commit verified final audit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete full application audit 2026-10-05 [skip ci]"
          git push origin HEAD:main
