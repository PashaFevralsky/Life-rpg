name: Apply Life RPG Final Audit 2026-10-05
run-name: Final audit • patch, full regression, build and commit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-final-audit-2026-10-05
  cancel-in-progress: false

jobs:
  final-audit:
    name: Apply all audit fixes and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard expected pre-audit state
        shell: bash
        run: |
          test ! -e FINAL-AUDIT-2026-10-05.md || { echo "Final audit already applied"; exit 1; }
          grep -q 'const APP_VERSION="13.9.1"' core.js
          grep -q '"targetVersion": "14.1.2"' android-release-config.json
          grep -q 'product-core-14.1.2.test.js' package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

