name: Repair reportStart race 13.7.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-hotfix-13.7.5.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: life-rpg-pages
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch reportStart boot finalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hotfix = Path("report-start-hotfix.js")
          src = hotfix.read_text(encoding="utf-8")

          start = src.find("  async function activate(){")
          end = src.rfind("})();")
          if start < 0 or end <= start:
              raise SystemExit("report-start-hotfix.js: activation block not found")

          lines = [
              "  let REPORT_START_FINALIZED=false;",
              "",
              "  async function lifeReportStartFinalize(){",
              "    try{",
              "      installWrappers();",
              "      if(REPORT_START_FINALIZED)return false;",
              '      if(typeof storage137BootSettling!=="undefined"&&storage137BootSettling)return false;',
              "      if(!stateReady())return false;",
              "",
              "      REPORT_START_FINALIZED=true;",
              "      const changed=rebuildCampaignGamification();",
              "",
              '      if(changed&&typeof persist==="function"){',
              '        try{await persist()}catch(e){console.warn("reportStart cleanup persist failed",e)}',
              "      }",
              '      if(changed&&typeof render==="function"){',
              "        try{render()}catch{}",
              "      }",
              "      return changed",
              "    }catch(e){",
              '      console.error("reportStart hotfix failed",e);',
              "      return false",
              "    }",
              "  }",
              "",
              "  window.lifeReportStartFinalize=lifeReportStartFinalize;",
              "  installWrappers();",
              "",
          ]
          replacement = "\n".join(lines) + "\n"
          hotfix.write_text(src[:start] + replacement + src[end:], encoding="utf-8")

          bootstrap = Path("bootstrap.js")
          b = bootstrap.read_text(encoding="utf-8")
          old = 'if(typeof storage137BootSettling!=="undefined")storage137BootSettling=false;requestAnimationFrame(()=>document.documentElement?.classList?.remove("life-rpg-booting"))'
          new = 'if(typeof storage137BootSettling!=="undefined")storage137BootSettling=false;if(typeof globalThis.lifeReportStartFinalize==="function")await globalThis.lifeReportStartFinalize();requestAnimationFrame(()=>document.documentElement?.classList?.remove("life-rpg-booting"))'
          if old not in b:
              raise SystemExit("bootstrap.js: boot-finalization anchor not found")
          bootstrap.write_text(b.replace(old, new, 1), encoding="utf-8")

          h = hotfix.read_text(encoding="utf-8")
          if "async function activate(){" in h:
              raise SystemExit("Old activate() remains")
          if "setTimeout(()=>{void activate()}" in h:
              raise SystemExit("Old delayed activation remains")
          if "window.lifeReportStartFinalize=lifeReportStartFinalize" not in h:
              raise SystemExit("Finalize hook missing")
          if "await globalThis.lifeReportStartFinalize()" not in bootstrap.read_text(encoding="utf-8"):
              raise SystemExit("Bootstrap finalize hook missing")

          broken = Path(".github/workflows/fix-report-start-race-13.7.5.yml")
          if broken.exists():
              broken.unlink()

          print("Patched reportStart boot race and removed obsolete broken workflow.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and static tests
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Verify production service worker
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile E2E
        run: npm run test:e2e

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap.js report-start-hotfix.js
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix reportStart boot race"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: repair
    if: needs.repair.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
