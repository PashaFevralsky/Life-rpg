name: Fix Life RPG 13.9.0 final gates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-fix-13-9-0-final-v2
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch remaining 13.9.0 issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/release-interface-13.9.0-once.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          version_anchor = '          new_e2e_text=old_e2e.read_text(encoding="utf-8").replace(OLD,NEW)\n'
          version_patch = (
              version_anchor
              + '          new_release_text=new_release_text.replace(r"13\\.8\\.0",r"13\\.9\\.0")\n'
              + '          new_e2e_text=new_e2e_text.replace(r"13\\.8\\.0",r"13\\.9\\.0")\n'
          )
          if 'new_e2e_text=new_e2e_text.replace(r"13\\.8\\.0",r"13\\.9\\.0")' not in workflow:
              if version_anchor not in workflow:
                  raise SystemExit("Release-test version anchor not found")
              workflow = workflow.replace(version_anchor, version_patch, 1)

          workflow_path.write_text(workflow, encoding="utf-8")

          ui_path = Path("ui.js")
          ui = ui_path.read_text(encoding="utf-8")

          if "function ui139SyncCommandPalette(sectionId)" not in ui:
              chrome_marker = "function ui82SyncChrome(sectionId,view){"
              helper = (
                  'function ui139SyncCommandPalette(sectionId){\n'
                  '  const btn=document.getElementById("commandPaletteBtn");if(!btn)return;\n'
                  '  const target=sectionId==="today"?document.querySelector(".top-actions"):document.querySelector(`#${sectionId} .ux7-head-actions`);\n'
                  '  if(target&&btn.parentElement!==target)target.insertBefore(btn,target.firstChild);\n'
                  '}\n\n'
              )
              if chrome_marker not in ui:
                  raise SystemExit("ui82SyncChrome anchor not found")
              ui = ui.replace(chrome_marker, helper + chrome_marker, 1)

          call = "  ui139SyncCommandPalette(sectionId);\n"
          if call not in ui:
              dataset_anchor = '  if(document.body?.dataset){document.body.dataset.section=sectionId;document.body.dataset.view=view}\n'
              if dataset_anchor not in ui:
                  raise SystemExit("ui82SyncChrome dataset anchor not found")
              ui = ui.replace(dataset_anchor, dataset_anchor + call, 1)

          ui_path.write_text(ui, encoding="utf-8")

          final_workflow = workflow_path.read_text(encoding="utf-8")
          final_ui = ui_path.read_text(encoding="utf-8")
          checks = {
              "escaped release version migration": 'new_e2e_text=new_e2e_text.replace(r"13\\.8\\.0",r"13\\.9\\.0")' in final_workflow,
              "command palette helper": "function ui139SyncCommandPalette(sectionId)" in final_ui,
              "command palette sync call": "ui139SyncCommandPalette(sectionId);" in final_ui,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Patch verification failed: " + ", ".join(failed))

          print("OK — remaining 13.9.0 issues patched")
          PY

      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/fix-release-13.9.0-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js .github/workflows/release-interface-13.9.0-once.yml
          git add -u .github/workflows/fix-release-13.9.0-final.yml || true
          git diff --cached --check
          git commit -m "Fix remaining Life RPG 13.9.0 release gates"
          git push origin HEAD:main
