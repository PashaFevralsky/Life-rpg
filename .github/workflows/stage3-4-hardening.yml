name: Repository cleanup after Life RPG 13.7.4

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage3-4-hardening.yml"

permissions:
  contents: write

concurrency:
  group: life-rpg-repository-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean repository structure
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Generated content must never live in Git.
          git rm -r -q --ignore-unmatch node_modules dist test-results
          rm -rf playwright-report

          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          test-results/
          playwright-report/
          *.log
          .DS_Store
          EOF

          # Preserve useful history, but remove it from the repository root.
          mkdir -p docs/history docs/guides

          for f in CHANGELOG-*.txt AUDIT-*.txt RELEASE-MANIFEST-*.json TEST-REPORT-*.txt SHA256SUMS*.txt; do
            [ -e "$f" ] && git mv "$f" docs/history/
          done

          for f in AI-BRIDGE-13.4-SETUP.txt PHONE-SETUP-GUIDE.txt README-TENNIS-HUAWEI.txt; do
            [ -e "$f" ] && git mv "$f" docs/guides/
          done

          # One-time phone upload / migration / hotfix instructions are obsolete.
          for f in \
            GITHUB-UPLOAD-*.txt \
            HOTFIX-*.txt \
            *-HOTFIX*.txt \
            UPLOAD-*.txt \
            *-UPDATE.txt \
            INSTALL-13.3.0.txt \
            README-12.0.2.txt \
            README.txt \
            DEPLOY-PAGES-WORKFLOW.yml \
            deploy-pages.yml \
            deploy-pages-final.yml \
            GROWTH-OS-MANIFEST.json \
            PERSONAL-OS-MANIFEST.json
          do
            [ -e "$f" ] && git rm -f "$f"
          done

          # Hardening/migration workflows were one-shot tools. Keep only production deploy.
          git rm -f --ignore-unmatch \
            .github/workflows/stage3-2-release-sync.yml \
            .github/workflows/stage3-3-hardening.yml \
            .github/workflows/stage3-5-final-hardening.yml \
            .github/workflows/stage3-4-hardening.yml

          cat > README.md <<'EOF'
          # Life RPG 13.7.4

          Local-first Personal OS / PWA designed for mobile use.

          - Current release: **13.7.4**
          - State schema: **v18**
          - Production deploy: `.github/workflows/deploy-pages.yml`
          - Storage: IndexedDB with localStorage fallback, snapshots, Recovery Center and Safe Mode
          - PWA: Vite + Workbox, offline shell, Android Share Target

          ## Development checks

          ```bash
          npm ci
          npm test
          npm run build
          node dist-audit.test.js
          npx playwright install chromium
          npm run test:e2e
          ```

          GitHub Pages runs the same production gate before deployment.

          ## Repository structure

          Runtime/source files and regression tests live in the repository root.
          `READING-LIST-27.json` is part of the application runtime.

          Generated directories are intentionally not versioned:

          - `node_modules/`
          - `dist/`
          - `test-results/`
          - `playwright-report/`

          Historical audits, changelogs, release manifests and test reports are stored in `docs/history/`.
          Device/setup notes that are still potentially useful are stored in `docs/guides/`.
          EOF

          cat > docs/history/README.md <<'EOF'
          # Historical release records

          This directory contains archived changelogs, audit reports, release manifests,
          checksums and test reports from earlier Life RPG releases.

          These files are documentation only and are not required by the runtime or CI.
          EOF

          cat > docs/guides/README.md <<'EOF'
          # Guides

          Setup/device notes retained for reference. They are not part of the application runtime.
          EOF

          git diff --check

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full unit and static test suite
        run: npm test

      - name: Build clean production PWA
        run: npm run build

      - name: Verify generated production service worker
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full mobile/browser E2E
        run: npm run test:e2e

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '^(node_modules|dist|test-results|playwright-report)/' >/dev/null; then
            echo "Generated files are still tracked"
            exit 1
          fi

          test -f .gitignore
          test -f .github/workflows/deploy-pages.yml

          extra_workflows="$(find .github/workflows -maxdepth 1 -type f ! -name 'deploy-pages.yml' -print)"
          if [ -n "$extra_workflows" ]; then
            echo "Unexpected workflow files remain:"
            echo "$extra_workflows"
            exit 1
          fi

          test "$(node -p "require('./package.json').version")" = "13.7.4"
          grep -q 'APP_VERSION="13.7.4"' core.js

          echo "Repository hygiene OK"

      - name: Commit cleaned repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 1
          fi
          git commit -m "Repository cleanup after Life RPG 13.7.4 hardening"
          git push origin HEAD:main
