name: Apply Stage 3.4 transactional hardening

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage3-4-hardening.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stage3-4-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Stage 3.4 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/stage3-4-patcher.js
          node /tmp/stage3-4-patcher.js

      - name: Run full unit and static test suite
        run: npm test

      - name: Build Vite + Workbox PWA
        run: npm run build

      - name: Verify production service worker
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile/browser E2E
        run: npm run test:e2e

      - name: Commit Stage 3.4 only after all checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            state.js finance.js imports.js import-hub.js knowledge.js calibration-os.js share-hub.js \
            stage3-action-atomicity.test.js package.json package-lock.json \
            core.js manifest.webmanifest vite.config.mjs index.html \
            static-check.js architecture.test.js stage2-ci-release-integrity.test.js dist-audit.test.js \
            mobile-share-13.1.test.js android-acceptance-13.1.1.test.js decision-intelligence-13.2.test.js \
            intelligence-calibration-13.2.1.test.js predictive-trends-13.2.2.test.js recovery-13.3.test.js gpt-exchange-13.5.test.js \
            e2e.test.js decision-intelligence-13.2.e2e.test.js gpt-exchange-13.5.e2e.test.js \
            intelligence-calibration-13.2.1.e2e.test.js personal-os.e2e.test.js predictive-trends-13.2.2.e2e.test.js \
            recovery-13.3.e2e.test.js secure-ai-bridge-13.4.e2e.test.js stabilization-13.0.e2e.test.js \
            stage3-concurrency-safemode.e2e.test.js
          git diff --cached --quiet && { echo "No Stage 3.4 changes to commit"; exit 1; }
          git commit -m "Stage 3.4 transactional hardening — Life RPG 13.7.3"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: harden
    if: needs.harden.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Life RPG 13.7.3 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
