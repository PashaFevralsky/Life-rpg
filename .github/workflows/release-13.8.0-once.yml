name: Release Life RPG 13.8.0 (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-release-13-8-0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepare 13.8.0 sources and release gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os

          OLD="13.7.5"
          NEW="13.8.0"

          replace_files=[
            "core.js",
            "package-lock.json",
            "manifest.webmanifest",
            "index.html",
            "vite.config.mjs",
            "static-check.js",
            "architecture.test.js",
            "dist-audit.test.js",
            "stage2-ci-release-integrity.test.js",
            "stage3-final-hardening.test.js",
            "android-acceptance-13.1.1.test.js",
            "decision-intelligence-13.2.test.js",
            "gpt-exchange-13.5.test.js",
            "intelligence-calibration-13.2.1.test.js",
            "mobile-share-13.1.test.js",
            "predictive-trends-13.2.2.test.js",
            "recovery-13.3.test.js",
            "e2e.test.js",
            "personal-os.e2e.test.js",
            "decision-intelligence-13.2.e2e.test.js",
            "intelligence-calibration-13.2.1.e2e.test.js",
            "predictive-trends-13.2.2.e2e.test.js",
            "recovery-13.3.e2e.test.js",
            "gpt-exchange-13.5.e2e.test.js",
            "stabilization-13.0.e2e.test.js",
            "secure-ai-bridge-13.4.e2e.test.js",
            "stage3-concurrency-safemode.e2e.test.js",
            "stage3-final-hardening.e2e.test.js",
          ]

          for name in replace_files:
            p=Path(name)
            if not p.exists():
              raise SystemExit(f"Required release file missing: {name}")
            text=p.read_text(encoding="utf-8")
            if OLD not in text:
              raise SystemExit(f"Expected {OLD} marker missing in {name}; release script refuses to guess")
            p.write_text(text.replace(OLD,NEW),encoding="utf-8")

          # package.json: version + permanent unit release gate.
          pkg_path=Path("package.json")
          pkg=json.loads(pkg_path.read_text(encoding="utf-8"))
          if pkg.get("version") not in (OLD,NEW):
            raise SystemExit(f"Unexpected package version: {pkg.get('version')}")
          pkg["version"]=NEW
          test_cmd=pkg.get("scripts",{}).get("test","")
          gate="node release-13.8.0.test.js"
          if gate not in test_cmd:
            pkg["scripts"]["test"]=test_cmd+" && "+gate
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Playwright: keep the two historical 13.7.5 regression filenames,
          # but add a permanent 13.8.0 release E2E gate.
          pw_path=Path("playwright.config.mjs")
          pw=pw_path.read_text(encoding="utf-8")
          release_e2e='"release-13.8.0.e2e.test.js"'
          if release_e2e not in pw:
            needle='"report-start-finance-13.7.5.e2e.test.js"],timeout'
            if needle not in pw:
              raise SystemExit("Could not locate Playwright testMatch insertion point")
            pw=pw.replace(needle,'"report-start-finance-13.7.5.e2e.test.js","release-13.8.0.e2e.test.js"],timeout')
          pw_path.write_text(pw,encoding="utf-8")

          RELEASE_TEST=os.environ["RELEASE_TEST"]
          RELEASE_E2E=os.environ["RELEASE_E2E"]
          Path("release-13.8.0.test.js").write_text(RELEASE_TEST,encoding="utf-8")
          Path("release-13.8.0.e2e.test.js").write_text(RELEASE_E2E,encoding="utf-8")

          # Production dist audit must permanently reject the removed runtime shims.
          da_path=Path("dist-audit.test.js")
          da=da_path.read_text(encoding="utf-8")
          marker='assert.ok(!fs.existsSync(path.join(dist,"personal-stabilization-os.js")),"legacy stabilization shim must not ship to production");'
          extra='\nassert.ok(!fs.existsSync(path.join(dist,"report-start-hotfix.js")),"legacy reportStart hotfix must not ship");\nassert.ok(!fs.existsSync(path.join(dist,"ui-polish-13.7.5.js")),"legacy UI polish shim must not ship");'
          if "legacy reportStart hotfix must not ship" not in da:
            if marker not in da:
              raise SystemExit("Could not patch dist audit cleanup assertions")
            da=da.replace(marker,marker+extra)
            da_path.write_text(da,encoding="utf-8")

          # Sanity: the old release number is now permitted only where it is
          # intentionally part of historical regression filenames/titles.
          allowed={
            "ui-polish-13.7.5.e2e.test.js",
            "report-start-finance-13.7.5.e2e.test.js",
            "playwright.config.mjs",
            "dist-audit.test.js",
            "release-13.8.0.test.js",
            "release-13.8.0.e2e.test.js",
            ".github/workflows/release-13.8.0-once.yml",
          }
          leftovers=[]
          for p in Path(".").rglob("*"):
            if not p.is_file():
              continue
            if any(part in {".git","node_modules","dist","test-results","playwright-report"} for part in p.parts):
              continue
            rel=p.as_posix()
            try:
              text=p.read_text(encoding="utf-8")
            except Exception:
              continue
            if OLD in text and rel not in allowed:
              leftovers.append(rel)
          if leftovers:
            raise SystemExit("Unexpected 13.7.5 references remain: "+", ".join(sorted(leftovers)))

          print("Prepared Life RPG 13.8.0 source release.")
          PY
        env:
          RELEASE_TEST: |
            "use strict";
            process.env.TZ="Europe/Amsterdam";
            const fs=require("fs"),vm=require("vm"),path=require("path"),assert=require("assert");
            const root=__dirname,read=n=>fs.readFileSync(path.join(root,n),"utf8");
            
            const core=read("core.js"),pkg=JSON.parse(read("package.json")),lock=JSON.parse(read("package-lock.json")),
                  manifest=read("manifest.webmanifest"),html=read("index.html"),vite=read("vite.config.mjs"),
                  bootstrap=read("bootstrap.js"),playwright=read("playwright.config.mjs");
            
            assert.ok(core.includes('APP_VERSION="13.8.0"'));
            assert.equal(pkg.version,"13.8.0");
            assert.equal(lock.version,"13.8.0");
            assert.equal(lock.packages?.[""]?.version,"13.8.0");
            assert.ok(manifest.includes("Life RPG 13.8.0"));
            assert.ok(html.includes("<title>Life RPG 13.8.0</title>"));
            assert.ok(html.includes('window.__LIFE_RPG_HTML_VERSION__="13.8.0"'));
            assert.ok(vite.includes('cacheId:"life-rpg-13.8.0"'));
            assert.ok(pkg.scripts.test.includes("release-13.8.0.test.js"));
            assert.ok(playwright.includes("release-13.8.0.e2e.test.js"));
            
            for(const f of ["report-start-hotfix.js","ui-polish-13.7.5.js",
              ".github/workflows/fix-report-start-race-13.7.5.yml",
              ".github/workflows/release-hotfix-13.7.5- v3.yml"]){
              assert.ok(!fs.existsSync(path.join(root,f)),`${f} must be removed`);
            }
            assert.ok(!bootstrap.includes("report-start-hotfix.js")&&!bootstrap.includes("ui-polish-13.7.5.js"));
            assert.ok(!vite.includes("report-start-hotfix.js")&&!vite.includes("ui-polish-13.7.5.js"));
            
            const RealDate=Date,FIXED="2026-09-28T12:00:00+02:00";
            class FixedDate extends RealDate{
              constructor(...args){super(...(args.length?args:[FIXED]))}
              static now(){return new RealDate(FIXED).getTime()}
              static parse(v){return RealDate.parse(v)}
              static UTC(...args){return RealDate.UTC(...args)}
            }
            
            const ctx=vm.createContext({
              console,Date:FixedDate,Math,JSON,Intl,Number,Promise,
              setTimeout:()=>0,clearTimeout:()=>{},setInterval:()=>0,
              structuredClone:global.structuredClone,crypto:global.crypto,
              document:{getElementById:()=>null,querySelectorAll:()=>[],addEventListener:()=>{},body:{classList:{add(){},remove(){}}}},
              window:{addEventListener:()=>{},scrollTo:()=>{},location:{reload:()=>{}}},
              navigator:{},location:{reload:()=>{}},
              localStorage:{getItem:()=>null,setItem:()=>{},removeItem:()=>{}},
              Notification:function(){},confirm:()=>true,prompt:()=>"",Blob:global.Blob,URL:global.URL
            });
            ctx.window.window=ctx.window;ctx.window.document=ctx.document;
            for(const f of ["core.js","state.js","finance.js"])
              new vm.Script(fs.readFileSync(path.join(root,f),"utf8"),{filename:f}).runInContext(ctx);
            const run=x=>new vm.Script(x).runInContext(ctx);
            
            run(`S=deepClone(DEFAULT_STATE);
            S.settings.reportStart="2026-10-01";
            S.settings.campaignStart="2026-10-01";
            S.settings.monthlyDebtGoal=91000;
            S.settings.monthlyIncome=150000;
            S.settings.incomeEvents=[
            {id:"d5",day:5,label:"Доход 5",amount:50000},
            {id:"d15",day:15,label:"Доход 15",amount:50000},
            {id:"d20",day:20,label:"Доход 20",amount:50000}
            ];
            S.envelopeLimits={"Еда":17000,"Транспорт":10000,"Дом":0,"Связь":2000,"Развлечения":1000,"Теннис":9000,"Покупки":2000,"Другое":8000};
            S.envelopeCarryovers={"2026-10":{"Еда":1234}};
            S.debts=[{id:"d",name:"D",balance:100000,initial:100000,rate:50,rateKnown:true,min:5000,dueDay:10,nextPaymentDate:"2026-10-10",nextPaymentAmount:5000,paymentMode:"fixed",parts:[]}];
            S.payments=[{id:"oldp",localDate:"2026-09-15",monthKey:"2026-09",amount:1000,debtId:"d",debtIndex:0}];
            S.expenses=[{id:"olde",dateKey:"2026-09-20",amount:999,category:"Еда"},{id:"newe",dateKey:"2026-10-02",amount:100,category:"Еда"}];
            S.incomeLogs=[{id:"oldi",dateKey:"2026-09-20",amount:1000},{id:"newi",dateKey:"2026-10-05",amount:50000}];`);
            
            assert.equal(run(`reportStartKey()`),"2026-10-01");
            assert.equal(run(`reportingDateAllowed("2026-09-30")`),false);
            assert.equal(run(`reportingDateAllowed("2026-10-01")`),true);
            assert.equal(run(`monthExpenses("2026-09")`),0);
            assert.equal(run(`monthIncome("2026-09")`),0);
            assert.equal(run(`monthPayments("2026-09")`),0);
            assert.equal(run(`monthCategorySpend("Еда","2026-09")`),0);
            assert.equal(run(`monthExpenses("2026-10")`),100);
            assert.equal(run(`monthIncome("2026-10")`),50000);
            assert.equal(run(`envelopeCarry("Еда","2026-10")`),0);
            assert.equal(run(`plannedIncomeForMonth()`),150000);
            assert.equal(run(`plannedExtraDebtOnDate(new Date(2026,8,28,12))`),0);
            assert.equal(run(`projectedDailyLiving(new Date(2026,8,28,12))`),0);
            assert.equal(run(`remainingMinimumsThisMonth()`),0);
            assert.equal(run(`financeMonthMetrics("2026-09").debtGoal`),0);
            assert.equal(run(`financialPhase().id`),"scheduled");
            assert.equal(run(`cashAdvice().recommended`),0);
            assert.equal(run(`autopilotPlan().debtExtra`),0);
            assert.equal(run(`nextPlannedIncomeDate(new Date(2026,8,28,12)).monthKey`),"2026-10");
            
            const normalized=run(`(()=>{
              const x=deepClone(DEFAULT_STATE);
              x.settings.reportStart="2026-10-01";
              x.settings.campaignStart="2026-10-01";
              x.expenses=[{id:"hist",dateKey:"2026-09-20",amount:10,category:"Еда"}];
              x.xpEvents=[
                {id:"xpold",date:"2026-09-20T12:00:00",xp:100,stat:"Финансы"},
                {id:"xpnew",date:"2026-10-02T12:00:00",xp:50,stat:"Финансы"}
              ];
              x.xpEarned=150;
              return normalizeState(x)
            })()`);
            assert.equal(normalized.expenses.length,1,"factual pre-start history must be preserved");
            assert.equal(normalized.xpEvents.length,0,"campaign XP must remain zero before reportStart");
            assert.equal(normalized.xpEarned,0);
            
            console.log("OK — Life RPG 13.8.0 release gate: version alignment, native report boundary, finance invariants and history preservation");
          RELEASE_E2E: |
            import { test, expect } from "@playwright/test";
            
            async function boot(page){
              await page.setViewportSize({width:390,height:844});
              await page.goto("/",{waitUntil:"domcontentloaded"});
              await expect(page.locator("html")).not.toHaveClass(/life-rpg-booting/);
            }
            
            test("13.8.0 release: native reportStart boundary and integrated mobile UI",async({page})=>{
              await boot(page);
              await expect(page).toHaveTitle(/Life RPG 13\.8\.0/);
            
              const runtime=await page.evaluate(()=>({
                version:APP_VERSION,
                oldHotfix:[...document.scripts].some(s=>/report-start-hotfix|ui-polish-13\.7\.5/.test(s.src)),
                core:typeof reportStartKey==="function"&&typeof reportingDateAllowed==="function"
              }));
              expect(runtime.version).toBe("13.8.0");
              expect(runtime.oldHotfix).toBe(false);
              expect(runtime.core).toBe(true);
            
              await page.evaluate(()=>{
                const start=new Date();
                start.setMonth(start.getMonth()+1,1);
                S.settings.reportStart=localDateKey(start);
                S.settings.campaignStart=localDateKey(start);
                S.settings.monthlyDebtGoal=91000;
                S.envelopeLimits={"Еда":17000,"Транспорт":10000,"Дом":0,"Связь":2000,"Развлечения":1000,"Теннис":9000,"Покупки":2000,"Другое":8000};
                switchTab("finance");
                ux7SetView("finance","analysis",false);
                render();
              });
              await page.waitForTimeout(100);
            
              const pre=await page.evaluate(()=>({
                extra:plannedExtraDebtOnDate(new Date()),
                living:projectedDailyLiving(new Date()),
                phase:financialPhase().id,
                need:document.getElementById("finNeed")?.textContent||""
              }));
              expect(pre.extra).toBe(0);
              expect(pre.living).toBe(0);
              expect(pre.phase).toBe("scheduled");
              expect(pre.need).toContain("Старт");
            
              const nav=await page.locator("#finance .ux7-tabs").evaluate(el=>({
                display:getComputedStyle(el).display,
                count:el.querySelectorAll(".ux7-tab").length
              }));
              expect(nav.display).toBe("grid");
              expect(nav.count).toBe(6);
              await expect(page.locator(".ui-polish-model-note").first()).toBeVisible();
              await expect(page.locator(".ui-polish-chart-details")).toHaveCount(1);
            });

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate clean Workbox service worker
        run: |
          npm run build
          cp dist/sw.js sw.js

      - name: Run full unit/static suite
        run: npm test

      - name: Verify production dist
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 13.8.0 release E2E
        run: npx playwright test release-13.8.0.e2e.test.js

      - name: Commit release and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/release-13.8.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Release Life RPG 13.8.0"
          git push origin HEAD:main
