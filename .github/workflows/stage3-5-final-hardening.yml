name: Apply Stage 3.5 final hardening

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage3-5-final-hardening.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stage3-5-final-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Stage 3.5 final patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/stage3-5-patcher.js
          node /tmp/stage3-5-patcher.js
          git diff --check

      - name: Run full unit and static test suite
        run: npm test

      - name: Build Vite + Workbox PWA
        run: npm run build

      - name: Verify production service worker
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full mobile/browser E2E
        run: npm run test:e2e

      - name: Commit final hardening only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "Stage 3.5 final hardening — Life RPG 13.7.4"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: harden
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Life RPG 13.7.4 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
