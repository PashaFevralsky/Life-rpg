            stage2-ci-release-integrity.test.js recovery-13.3.test.js dist-audit.test.js \
            stage3-system-hardening.test.js \
            '*.e2e.test.js'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Stage 3.2 system hardening — Life RPG 13.7.1"
