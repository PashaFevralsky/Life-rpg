name: Apply Stage 3.2 hardening

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage3-2-hardening.yml"

permissions:
  contents: write

concurrency:
  group: life-rpg-stage3-2-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Stage 3.2 patch
        shell: bash
        run: |
          node <<'NODE'
                    "use strict";
                    const fs=require("fs");
                    const TARGET="13.7.1";
          
                    const read=p=>fs.readFileSync(p,"utf8");
                    const write=(p,s)=>fs.writeFileSync(p,s);
                    function once(s,a,b,label){
                      const n=s.split(a).length-1;
                      if(n!==1)throw new Error(`${label}: expected exactly 1 match, got ${n}`);
                      return s.replace(a,b)
                    }
                    function patch(path,fn){
                      const before=read(path),after=fn(before);
                      if(after===before)throw new Error(`${path}: patch produced no change`);
                      write(path,after);
                      console.log(`patched ${path}: ${before.length} -> ${after.length}`)
                    }
          
                    if(read("core.js").includes(`APP_VERSION="${TARGET}"`) && fs.existsSync("stage3-system-hardening.test.js")){
                      console.log(`Stage 3.2 ${TARGET} is already applied`);
                      process.exit(0)
                    }
          
