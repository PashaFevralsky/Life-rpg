name: Fix Android RC Geometry Contracts 2026-10-05 R3
run-name: Android RC • verify geometry contracts with native bridge

"on":
  push:
    paths:
      - ".github/workflows/fix-android-rc-geometry-contracts-r3-2026-10-05.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-android-geometry-contract-fix-r3
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Align Android geometry and audit contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = ""
          Path(".fix-android-geometry-contracts.py").write_bytes(base64.b64decode(data))
          PY
          python3 .fix-android-geometry-contracts.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax-check corrected tests
        run: |
          node --check android-ui-14.e2e.test.js
          node --check audit-fix-2026-10-05.test.js

      - name: Run full regression suite
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Audit production web bundle
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser E2E
        run: npm run test:e2e

      - name: Build Android Life Ops native bridge
        run: |
          npx vite build --config android-life-ops-native.vite.mjs
          test -s dist/android-life-ops-native.js
          grep -q "LocalNotifications" dist/android-life-ops-native.js

      - name: Prepare Android RC web assets
        run: node android-release-prepare.mjs

      - name: Run corrected Android RC geometry gate
        run: npx playwright test --config=playwright.android-rc.config.mjs

      - name: Commit verified contract fix
        shell: bash
        run: |
          rm -f .fix-android-geometry-contracts.py
          git status --short
          git add android-ui-14.e2e.test.js audit-fix-2026-10-05.test.js FINAL-AUDIT-2026-10-05.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Android geometry and audit contracts"
          git push origin HEAD:main
