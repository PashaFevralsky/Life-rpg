name: Build Life RPG Android Signed Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "android-safe-area.css"
      - "android-native-share.js"
      - "android-native-share-patch.mjs"
      - "life-ops.js"
      - ".github/workflows/android-beta.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - "index.html"
      - "manifest.webmanifest"
      - "icon-192.png"
      - "icon-512.png"
      - "READING-LIST-27.json"
      - "*.js"
      - "*.css"

permissions:
  contents: read

concurrency:
  group: life-rpg-android-signed-beta
  cancel-in-progress: true

jobs:
  build-android-signed-beta:
    name: Test, sign and build updateable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Life RPG dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Life RPG regression gate
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Audit production bundle
        run: node dist-audit.test.js

      - name: Verify Capacitor SystemBars configuration
        run: |
          node <<'NODE'
          const c = require("./capacitor.config.json");
          if (c?.plugins?.SystemBars?.insetsHandling !== "css") {
            throw new Error("SystemBars.insetsHandling must be css");
          }
          NODE

      - name: Install pinned Capacitor toolchain and Local Notifications
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "package.json";
          const p = JSON.parse(fs.readFileSync(path, "utf8"));
          p.dependencies = p.dependencies || {};
          p.dependencies["@capacitor/local-notifications"] = "8.3.1";
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + "\n");
          NODE
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/local-notifications@8.3.1

      - name: Disable PWA Service Worker inside Android bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "dist/pwa.js";
          let s = fs.readFileSync(path, "utf8");

          const needle = "function setupPwa(){";
          const replacement = `function setupPwa(){
            if(globalThis.__LIFE_RPG_ANDROID__){
              pwaSetupDone=true;
              const box=typeof $==="function"?$("versionStatus"):null;
              if(box)box.textContent=\`Life RPG \${APP_VERSION} • Android APK • локальные данные v\${STATE_VERSION}\`;
              return;
            }`;

          if (!s.includes(needle)) throw new Error("setupPwa() signature not found");
          s = s.replace(needle, replacement);
          fs.writeFileSync(path, s);

          if (!fs.readFileSync(path, "utf8").includes("__LIFE_RPG_ANDROID__")) {
            throw new Error("Android Service Worker guard was not applied");
          }
          NODE

      - name: Build real Capacitor NativeShare JS proxy
        shell: bash
        run: |
          cat > android-native-share-entry.tmp.js <<'JS'
          import { registerPlugin } from '@capacitor/core';
          globalThis.LifeRpgNativeSharePlugin = registerPlugin('NativeShare');
          JS

          cat > android-native-share.vite.tmp.mjs <<'JS'
          import { defineConfig } from 'vite';
          import { resolve } from 'node:path';

          export default defineConfig({
            build: {
              lib: {
                entry: resolve(process.cwd(), 'android-native-share-entry.tmp.js'),
                name: 'LifeRpgNativeShareProxy',
                formats: ['iife'],
                fileName: () => 'android-native-share-plugin.js'
              },
              outDir: resolve(process.cwd(), 'dist'),
              emptyOutDir: false,
              minify: false
            }
          });
          JS

          npx vite build --config android-native-share.vite.tmp.mjs
          test -s dist/android-native-share-plugin.js
          grep -q "NativeShare" dist/android-native-share-plugin.js

      - name: Build Android Life Ops notifications bridge
        shell: bash
        run: |
          cat > android-life-ops-native-entry.tmp.js <<'JS'
          import { LocalNotifications } from '@capacitor/local-notifications';
          globalThis.LifeRpgNativeNotifications = LocalNotifications;
          JS

          cat > android-life-ops-native.vite.tmp.mjs <<'JS'
          import { defineConfig } from 'vite';
          import { resolve } from 'node:path';

          export default defineConfig({
            build: {
              lib: {
                entry: resolve(process.cwd(), 'android-life-ops-native-entry.tmp.js'),
                name: 'LifeRpgLifeOpsNative',
                formats: ['iife'],
                fileName: () => 'android-life-ops-native.js'
              },
              outDir: resolve(process.cwd(), 'dist'),
              emptyOutDir: false,
              minify: false
            }
          });
          JS

          npx vite build --config android-life-ops-native.vite.tmp.mjs
          test -s dist/android-life-ops-native.js
          grep -q "LocalNotifications" dist/android-life-ops-native.js

      - name: Apply Android-only web layers
        shell: bash
        run: |
          test -f android-safe-area.css
          test -f android-native-share.js
          test -f life-ops.js

          cp android-safe-area.css dist/android-safe-area.css
          cp android-native-share.js dist/android-native-share.js

          node <<'NODE'
          const fs = require("fs");
          const path = "dist/index.html";
          let html = fs.readFileSync(path, "utf8");

          const marker = '<script>window.__LIFE_RPG_ANDROID__=true;</script>';
          if (!html.includes(marker)) {
            if (!html.includes("</head>")) throw new Error("dist/index.html has no </head>");
            html = html.replace("</head>", `${marker}\n</head>`);
          }

          const css = '<link rel="stylesheet" href="./android-safe-area.css">';
          if (!html.includes(css)) {
            if (!html.includes("</head>")) throw new Error("dist/index.html has no </head>");
            html = html.replace("</head>", `${css}\n</head>`);
          }

          const nativeOps = '<script src="./android-life-ops-native.js"></script>';
          if (!html.includes(nativeOps)) {
            const re = /<script src="\.\/bootstrap\.js[^\"]*"><\/script>/;
            if (!re.test(html)) throw new Error("bootstrap.js script tag not found");
            html = html.replace(re, `${nativeOps}\n$&`);
          }

          const proxy = '<script src="./android-native-share-plugin.js"></script>';
          const bridge = '<script src="./android-native-share.js"></script>';
          if (!html.includes(proxy) || !html.includes(bridge)) {
            if (!html.includes("</body>")) throw new Error("dist/index.html has no </body>");
            html = html.replace("</body>", `${proxy}\n${bridge}\n</body>`);
          }

          fs.writeFileSync(path, html);

          const finalHtml = fs.readFileSync(path, "utf8");
          const opsPos = finalHtml.indexOf("android-life-ops-native.js");
          const bootstrapPos = finalHtml.indexOf("bootstrap.js");
          const proxyPos = finalHtml.indexOf("android-native-share-plugin.js");
          const bridgePos = finalHtml.indexOf("android-native-share.js");

          if (!finalHtml.includes("__LIFE_RPG_ANDROID__")) throw new Error("Android runtime marker was not injected");
          if (!finalHtml.includes("android-safe-area.css")) throw new Error("Android safe-area stylesheet was not injected");
          if (opsPos < 0 || bootstrapPos < 0 || opsPos > bootstrapPos) throw new Error("Life Ops native bridge must load before bootstrap.js");
          if (proxyPos < 0) throw new Error("NativeShare plugin proxy was not injected");
          if (bridgePos < 0) throw new Error("NativeShare bridge was not injected");
          if (proxyPos > bridgePos) throw new Error("NativeShare proxy must load before bridge");
          NODE

      - name: Create Android project
        run: npx cap add android

      - name: Sync production bundle into Android
        run: npx cap sync android

      - name: Patch native Android Share Target
        run: node android-native-share-patch.mjs

      - name: Verify Android native integrations
        shell: bash
        run: |
          grep -R "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml
          grep -R "android.intent.action.SEND_MULTIPLE" android/app/src/main/AndroidManifest.xml
          grep -R "registerPlugin(NativeSharePlugin.class)" android/app/src/main/java
          grep -R '@CapacitorPlugin(name = "NativeShare")' android/app/src/main/java
          grep -R "getShareStatus" android/app/src/main/java
          test -s android/app/src/main/assets/public/android-native-share-plugin.js
          test -s android/app/src/main/assets/public/android-native-share.js
          test -s android/app/src/main/assets/public/android-life-ops-native.js
          grep -q "__LIFE_RPG_ANDROID__" android/app/src/main/assets/public/index.html
          grep -q "__LIFE_RPG_ANDROID__" android/app/src/main/assets/public/pwa.js
          grep -q "life-ops.js" android/app/src/main/assets/public/bootstrap.js
          grep -q "LocalNotifications" android/app/src/main/assets/public/android-life-ops-native.js
          test -f android/capacitor.settings.gradle
          grep -q "capacitor-local-notifications" android/capacitor.settings.gradle

      - name: Set Android version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");
          const path = "android/app/build.gradle";
          let s = fs.readFileSync(path, "utf8");
          const run = Number(process.env.GITHUB_RUN_NUMBER || 1);
          const code = 1309000 + run;
          const name = `${pkg.version}-beta.${run}`;
          if (!/versionCode\s+\d+/.test(s)) throw new Error("versionCode not found");
          if (!/versionName\s+"[^"]+"/.test(s)) throw new Error("versionName not found");
          s = s.replace(/versionCode\s+\d+/, `versionCode ${code}`);
          s = s.replace(/versionName\s+"[^"]+"/, `versionName "${name}"`);
          fs.writeFileSync(path, s);
          console.log(`Android versionCode=${code}, versionName=${name}`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }

          mkdir -p "$RUNNER_TEMP/life-rpg-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/life-rpg-signing/Life-RPG-release.keystore"

          keytool -list \
            -keystore "$RUNNER_TEMP/life-rpg-signing/Life-RPG-release.keystore" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias life-rpg >/dev/null

      - name: Configure release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  lifeRpgRelease {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "life-rpg"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lifeRpgRelease
                  }
              }
          }
          GRADLE

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/life-rpg-signing/Life-RPG-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare APK filename
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RUN="${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          mkdir -p android-out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "android-out/Life-RPG-${VERSION}-Signed-Beta-${RUN}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          path: android-out/Life-RPG-${{ steps.meta.outputs.version }}-Signed-Beta-${{ steps.meta.outputs.run }}.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
