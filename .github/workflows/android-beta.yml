name: Build Life RPG Android Signed Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "android-safe-area.css"
      - ".github/workflows/android-beta.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - "index.html"
      - "manifest.webmanifest"
      - "icon-192.png"
      - "icon-512.png"
      - "READING-LIST-27.json"
      - "*.js"
      - "*.css"

permissions:
  contents: read

concurrency:
  group: life-rpg-android-signed-beta
  cancel-in-progress: true

jobs:
  build-android-signed-beta:
    name: Test, sign and build updateable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Life RPG dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Life RPG regression gate
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Audit production bundle
        run: node dist-audit.test.js

      - name: Apply Android-only safe-area layer
        shell: bash
        run: |
          test -f android-safe-area.css
          cp android-safe-area.css dist/android-safe-area.css
          node <<'NODE'
          const fs = require("fs");
          const path = "dist/index.html";
          let html = fs.readFileSync(path, "utf8");
          const tag = '<link rel="stylesheet" href="./android-safe-area.css">';
          if (!html.includes(tag)) {
            if (!html.includes("</head>")) throw new Error("dist/index.html has no </head>");
            html = html.replace("</head>", `${tag}\n</head>`);
            fs.writeFileSync(path, html);
          }
          if (!fs.readFileSync(path, "utf8").includes("android-safe-area.css")) {
            throw new Error("Android safe-area stylesheet was not injected");
          }
          NODE

      - name: Verify Capacitor SystemBars configuration
        run: |
          node <<'NODE'
          const c = require("./capacitor.config.json");
          if (c?.plugins?.SystemBars?.insetsHandling !== "css") {
            throw new Error("SystemBars.insetsHandling must be css");
          }
          NODE

      - name: Install pinned Capacitor toolchain
        run: >
          npm install --no-save --package-lock=false
          @capacitor/core@8.5.2
          @capacitor/android@8.5.2
          @capacitor/cli@8.5.2

      - name: Create Android project
        run: npx cap add android

      - name: Sync production bundle into Android
        run: npx cap sync android

      - name: Set Android version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");
          const path = "android/app/build.gradle";
          let s = fs.readFileSync(path, "utf8");
          const run = Number(process.env.GITHUB_RUN_NUMBER || 1);
          const code = 1309000 + run;
          const name = `${pkg.version}-beta.${run}`;
          if (!/versionCode\s+\d+/.test(s)) throw new Error("versionCode not found");
          if (!/versionName\s+"[^"]+"/.test(s)) throw new Error("versionName not found");
          s = s.replace(/versionCode\s+\d+/, `versionCode ${code}`);
          s = s.replace(/versionName\s+"[^"]+"/, `versionName "${name}"`);
          fs.writeFileSync(path, s);
          console.log(`Android versionCode=${code}, versionName=${name}`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/life-rpg-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/life-rpg-signing/Life-RPG-release.keystore"
          keytool -list \
            -keystore "$RUNNER_TEMP/life-rpg-signing/Life-RPG-release.keystore" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias life-rpg >/dev/null

      - name: Configure release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  lifeRpgRelease {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "life-rpg"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lifeRpgRelease
                  }
              }
          }
          GRADLE

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/life-rpg-signing/Life-RPG-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare APK filename
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RUN="${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          mkdir -p android-out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "android-out/Life-RPG-${VERSION}-Signed-Beta-${RUN}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          path: android-out/Life-RPG-${{ steps.meta.outputs.version }}-Signed-Beta-${{ steps.meta.outputs.run }}.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
