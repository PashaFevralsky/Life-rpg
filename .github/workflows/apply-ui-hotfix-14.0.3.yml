name: Apply Life RPG 14.0.3 UI Hotfix
run-name: Apply 14.0.3 mobile-header UI hotfix and verify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-ui-hotfix-14-0-3
  cancel-in-progress: false

jobs:
  patch-test-commit:
    name: Patch, regression-test and commit UI hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse unexpected pre-existing hotfix
        shell: bash
        run: |
          test ! -e UI-HOTFIX-14.0.3.md || {
            echo "UI-HOTFIX-14.0.3.md already exists; hotfix appears applied."
            exit 1
          }
          node -e 'const c=require("./android-release-config.json"); if(c.targetVersion!=="14.0.2"||c.channel!=="rc") throw new Error(`Expected 14.0.2/rc, got ${c.targetVersion}/${c.channel}`)'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply 14.0.3 UI patch
        run: node apply-ui-hotfix-14.0.3.mjs

      - name: Syntax-check hotfix
        run: |
          node --check apply-ui-hotfix-14.0.3.mjs
          node --check ui-hotfix-14.0.3.test.js
          node --check android-ui-14.e2e.test.js

      - name: Run full regression suite
        run: npm test

      - name: Verify Android source contracts
        run: |
          node release-readiness-14.0.test.js
          node finance-rebuild-14.test.js
          node android-ui-14.test.js
          node android-tab-swipe-14.test.js

      - name: Build production PWA source
        run: npm run build

      - name: Audit production bundle
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser E2E
        run: npm run test:e2e

      - name: Show patch summary
        shell: bash
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Commit verified UI hotfix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android-ui-14.css \
            android-ui-14.test.js \
            android-ui-14.e2e.test.js \
            android-release-config.json \
            release-readiness-14.0.test.js \
            android-release-gate.test.js \
            package.json \
            ui-hotfix-14.0.3.test.js \
            UI-HOTFIX-14.0.3.md
          git diff --cached --check
          git commit -m "Fix Android mobile header UI for 14.0.3 [skip ci]"
          git push origin HEAD:main
