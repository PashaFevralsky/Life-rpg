name: Fix Life RPG 13.9.0 final gates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-rpg-fix-13-9-0-final-v3
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch UI and historical E2E source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("ui.js")
          ui = ui_path.read_text(encoding="utf-8")

          if "function ui139SyncCommandPalette(sectionId)" not in ui:
              marker = "function ui82SyncChrome(sectionId,view){"
              helper = (
                  'function ui139SyncCommandPalette(sectionId){\n'
                  '  const btn=document.getElementById("commandPaletteBtn");if(!btn)return;\n'
                  '  const target=sectionId==="today"?document.querySelector(".top-actions"):document.querySelector(`#${sectionId} .ux7-head-actions`);\n'
                  '  if(target&&btn.parentElement!==target)target.insertBefore(btn,target.firstChild);\n'
                  '}\n\n'
              )
              if marker not in ui:
                  raise SystemExit("ui82SyncChrome anchor not found")
              ui = ui.replace(marker, helper + marker, 1)

          call = "  ui139SyncCommandPalette(sectionId);\n"
          if call not in ui:
              anchor = '  if(document.body?.dataset){document.body.dataset.section=sectionId;document.body.dataset.view=view}\n'
              if anchor not in ui:
                  raise SystemExit("ui82SyncChrome dataset anchor not found")
              ui = ui.replace(anchor, anchor + call, 1)

          ui_path.write_text(ui, encoding="utf-8")

          e2e_path = Path("release-13.8.0.e2e.test.js")
          e2e = e2e_path.read_text(encoding="utf-8")
          old = 'await expect(page).toHaveTitle(/Life RPG 13\\.8\\.0/);'
          new = 'await expect(page).toHaveTitle("Life RPG 13.8.0");'
          if old in e2e:
              e2e = e2e.replace(old, new, 1)
          elif new not in e2e:
              raise SystemExit("13.8 release title assertion anchor not found")
          e2e_path.write_text(e2e, encoding="utf-8")

          final_ui = ui_path.read_text(encoding="utf-8")
          final_e2e = e2e_path.read_text(encoding="utf-8")
          assert "function ui139SyncCommandPalette(sectionId)" in final_ui
          assert "ui139SyncCommandPalette(sectionId);" in final_ui
          assert 'toHaveTitle("Life RPG 13.8.0")' in final_e2e

          print("OK — UI search access and release E2E source patched")
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js release-13.8.0.e2e.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fix Life RPG 13.9.0 final E2E blockers"
          git push origin HEAD:main
