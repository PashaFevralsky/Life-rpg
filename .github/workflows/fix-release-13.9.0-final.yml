name: Fix Life RPG 13.9.0 final release gates

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: life-rpg-fix-13-9-0-final
  cancel-in-progress: false

jobs:
  fix-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch 13.9.0 release workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/release-interface-13.9.0-once.yml")
          text = path.read_text(encoding="utf-8")

          # 1) Advance escaped version literals inside generated release tests too.
          old = '''          new_release_text=old_release.read_text(encoding="utf-8").replace(OLD,NEW)
          new_e2e_text=old_e2e.read_text(encoding="utf-8").replace(OLD,NEW)
'''
          new = '''          new_release_text=old_release.read_text(encoding="utf-8").replace(OLD,NEW)
          new_e2e_text=old_e2e.read_text(encoding="utf-8").replace(OLD,NEW)
          old_regex=OLD.replace(".",r"\\.")
          new_regex=NEW.replace(".",r"\\.")
          new_release_text=new_release_text.replace(old_regex,new_regex)
          new_e2e_text=new_e2e_text.replace(old_regex,new_regex)
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "old_regex=OLD.replace" not in text:
              raise SystemExit("Could not patch escaped release version migration")

          # 2) Keep the global command palette reachable when .top is hidden.
          old = '''          ui=ui.replace(old_switch,new_switch,1)
          ui_path.write_text(ui,encoding="utf-8")
'''
          new = '''          ui=ui.replace(old_switch,new_switch,1)

          # Keep the single global search button in the visible chrome of the active section.
          if "function ui139SyncCommandPalette(" not in ui:
              chrome_anchor="function ui82SyncChrome(sectionId,view){"
              chrome_helper='''function ui139SyncCommandPalette(sectionId){
  const btn=document.getElementById("commandPaletteBtn");if(!btn)return;
  const target=sectionId==="today"?document.querySelector(".top-actions"):document.querySelector(`#${sectionId} .ux7-head-actions`);
  if(target&&btn.parentElement!==target)target.insertBefore(btn,target.firstChild);
}

function ui82SyncChrome(sectionId,view){'''
              if chrome_anchor not in ui:
                  raise SystemExit("Could not locate ui82SyncChrome for command palette integration")
              ui=ui.replace(chrome_anchor,chrome_helper,1)

          sync_anchor='  if(document.body?.dataset){document.body.dataset.section=sectionId;document.body.dataset.view=view}\\n'
          if "ui139SyncCommandPalette(sectionId);" not in ui:
              if sync_anchor not in ui:
                  raise SystemExit("Could not locate ui82SyncChrome dataset anchor")
              ui=ui.replace(sync_anchor,sync_anchor+"  ui139SyncCommandPalette(sectionId);\\n",1)

          ui_path.write_text(ui,encoding="utf-8")
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "ui139SyncCommandPalette(sectionId)" not in text:
              raise SystemExit("Could not patch command palette chrome synchronization")

          # 3) Lock the command-palette regression into the 13.9 interface E2E contract.
          old = '''              expect(finance.bodyOverflow).toBeLessThanOrEqual(1);

              await page.evaluate(()=>ux7Go("work","overview"));
'''
          new = '''              expect(finance.bodyOverflow).toBeLessThanOrEqual(1);
              await expect(page.locator("#commandPaletteBtn")).toBeVisible();

              await page.evaluate(()=>ux7Go("work","overview"));
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'await expect(page.locator("#commandPaletteBtn")).toBeVisible();' not in text:
              raise SystemExit("Could not add command palette visibility E2E contract")

          # 4) Strengthen static contract for the chrome synchronizer.
          old = '''            assert.ok(ui.includes('aria-current'),"main navigation aria-current contract missing");
'''
          new = '''            assert.ok(ui.includes('aria-current'),"main navigation aria-current contract missing");
            assert.ok(ui.includes("ui139SyncCommandPalette"),"global command palette chrome synchronization missing");
'''
          if old in text and "global command palette chrome synchronization missing" not in text:
              text = text.replace(old, new, 1)

          # 5) Preflight the generated release gate, including escaped regex version literals.
          old = '''          const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
'''
          new = '''          const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const releaseE2E=fs.readFileSync("release-13.9.0.e2e.test.js","utf8");
'''
          if old in text and 'const releaseE2E=fs.readFileSync("release-13.9.0.e2e.test.js"' not in text:
              text = text.replace(old, new, 1)

          old = '''          assert.ok(ui.includes('classList.add("ui139")'));
'''
          new = '''          assert.ok(ui.includes('classList.add("ui139")'));
          assert.ok(ui.includes("ui139SyncCommandPalette"));
          assert.ok(releaseE2E.includes("13\\\\.9\\\\.0"));
          assert.ok(!releaseE2E.includes("13\\\\.8\\\\.0"));
'''
          if old in text and 'assert.ok(releaseE2E.includes("13\\\\.9\\\\.0"))' not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          # Sanity check the patch itself before committing.
          final = path.read_text(encoding="utf-8")
          required = [
              "old_regex=OLD.replace",
              "function ui139SyncCommandPalette",
              "ui139SyncCommandPalette(sectionId);",
              'await expect(page.locator("#commandPaletteBtn")).toBeVisible();',
              'const releaseE2E=fs.readFileSync("release-13.9.0.e2e.test.js","utf8");',
              'assert.ok(!releaseE2E.includes("13\\\\.8\\\\.0"));',
          ]
          missing = [x for x in required if x not in final]
          if missing:
              raise SystemExit("Patch incomplete: " + " | ".join(missing))

          print("OK — final 13.9.0 release workflow patch applied")
          PY

      - name: Commit patched release workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-release-13.9.0-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-interface-13.9.0-once.yml
          git add -u .github/workflows/fix-release-13.9.0-final.yml || true
          git diff --cached --check
          git commit -m "Fix final Life RPG 13.9.0 release gates"
          git push origin HEAD:main

      - name: Trigger patched 13.9.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run release-interface-13.9.0-once.yml --ref main
          echo "Triggered patched Life RPG 13.9.0 release."
