name: Stage 3.2 release sync and deploy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage3-2-release-sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stage3-2-release-sync
  cancel-in-progress: true

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync stale release assertions
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const fs=require("fs");
          const TARGET="13.7.1";
          const read=p=>fs.readFileSync(p,"utf8");
          const write=(p,s)=>fs.writeFileSync(p,s);

          function replaceExact(s,a,b,label){
            const n=s.split(a).length-1;
            if(n!==1)throw new Error(`${label}: expected exactly 1 match, got ${n}`);
            return s.replace(a,b);
          }
          function patch(path,fn){
            const before=read(path),after=fn(before);
            if(after===before)throw new Error(`${path}: patch produced no change`);
            write(path,after);
            console.log(`patched ${path}`);
          }

          patch("mobile-share-13.1.test.js",s=>{
            s=replaceExact(s,'APP_VERSION="13.2.2"',`APP_VERSION="${TARGET}"`,"mobile share app version");
            s=replaceExact(s,'cacheId:"life-rpg-13.2.2"',`cacheId:"life-rpg-${TARGET}"`,"mobile share cache");
            return s;
          });

          patch("android-acceptance-13.1.1.test.js",s=>{
            s=replaceExact(s,'APP_VERSION="13.2.2"',`APP_VERSION="${TARGET}"`,"android app version");
            s=replaceExact(s,'cacheId:"life-rpg-13.2.2"',`cacheId:"life-rpg-${TARGET}"`,"android cache");
            s=replaceExact(s,'manifest.name.includes("13.2.2")',`manifest.name.includes("${TARGET}")`,"android manifest");
            return s;
          });

          patch("decision-intelligence-13.2.test.js",s=>{
            s=replaceExact(s,'APP_VERSION="13.2.2"',`APP_VERSION="${TARGET}"`,"decision app version");
            s=replaceExact(s,'manifest.includes("Life RPG 13.2.2")',`manifest.includes("Life RPG ${TARGET}")`,"decision manifest");
            s=replaceExact(s,'cacheId:"life-rpg-13.2.2"',`cacheId:"life-rpg-${TARGET}"`,"decision cache");
            return s;
          });

          patch("intelligence-calibration-13.2.1.test.js",s=>{
            s=replaceExact(s,'APP_VERSION="13.2.2"',`APP_VERSION="${TARGET}"`,"calibration app version");
            s=replaceExact(s,'manifest.includes("Life RPG 13.2.2")',`manifest.includes("Life RPG ${TARGET}")`,"calibration manifest");
            s=replaceExact(s,'cacheId:"life-rpg-13.2.2"',`cacheId:"life-rpg-${TARGET}"`,"calibration cache");
            return s;
          });

          patch("predictive-trends-13.2.2.test.js",s=>{
            s=replaceExact(s,'APP_VERSION="13.2.2"',`APP_VERSION="${TARGET}"`,"predictive app version");
            s=replaceExact(s,'manifest.includes("Life RPG 13.2.2")',`manifest.includes("Life RPG ${TARGET}")`,"predictive manifest");
            s=replaceExact(s,'cacheId:"life-rpg-13.2.2"',`cacheId:"life-rpg-${TARGET}"`,"predictive cache");
            return s;
          });

          patch("gpt-exchange-13.5.test.js",s=>
            replaceExact(s,'APP_VERSION:"13.2.2"',`APP_VERSION:"${TARGET}"`,"gpt exchange app version")
          );

          console.log("Release assertion sync prepared for Life RPG 13.7.1");
          NODE

      - name: Run full unit and static test suite
        run: npm test

      - name: Build Vite + Workbox PWA
        run: npm run build

      - name: Verify production service worker
        run: node dist-audit.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile/browser E2E
        run: npm run test:e2e

      - name: Commit synced tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile-share-13.1.test.js \
            android-acceptance-13.1.1.test.js \
            decision-intelligence-13.2.test.js \
            intelligence-calibration-13.2.1.test.js \
            predictive-trends-13.2.2.test.js \
            gpt-exchange-13.5.test.js
          git diff --cached --quiet && { echo "No release-sync changes to commit"; exit 1; }
          git commit -m "Sync release assertions for Life RPG 13.7.1"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: sync-build
    if: needs.sync-build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Life RPG 13.7.1 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
